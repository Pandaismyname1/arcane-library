plugins { id 'java-library'; id 'idea'; id 'net.neoforged.moddev' version '2.0.148' }

version = project.property('mod_version')
group = project.property('mod_group_id')
base { archivesName = project.property('mod_id') }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

def modId = project.property('mod_id')
neoForge {
    version = project.property('neo_version')
    runs {
        client { client(); gameDirectory = file('run/client'); systemProperty 'neoforge.enabledGameTestNamespaces', modId }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', modId }
        gameTestServer { type = 'gameTestServer'; gameDirectory = file('run/gametest'); systemProperty 'neoforge.enabledGameTestNamespaces', modId; systemProperty 'arcane.compatTest', 'true' }
        data {
            clientData()
            programArguments.addAll '--mod', modId, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach { systemProperty 'forge.logging.markers', 'REGISTRIES'; logLevel = org.slf4j.event.Level.DEBUG }
    }
    mods { "${modId}" { sourceSet(sourceSets.main) } }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.14.0'
}
tasks.named('test', Test) { useJUnitPlatform() }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = ['minecraft_version', 'minecraft_version_range', 'neo_version', 'mod_name', 'mod_description',
                 'mod_license', 'mod_version', 'mod_authors'].collectEntries { [(it): project.property(it)] }
    props.mod_id = modId
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

