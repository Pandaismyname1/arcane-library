name: Label issues
on:
  issues:
    types: [ opened ]

# the issue forms ask which part of the mod is affected; this turns the answer into an area label
permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            // an issue form's answer is the paragraph under its "### Label" heading
            const answer = (heading) => {
              const match = body.match(new RegExp('^### ' + heading + '[^\\n]*\\n+([^\\n]+)', 'm'));
              return match ? match[1].trim() : null;
            };
            const areas = {
              'The Library and its rooms': 'area: library & rooms',
              'The tower, portals and getting home': 'area: tower & portals',
              'Mobs': 'area: mobs',
              'The Archivist': 'area: the Archivist',
              'Enchanting, tomes and Lumen Dust': 'area: enchanting',
              'Screens and the Codex': 'area: screens & Codex',
            };
            const labels = [areas[answer('Area')]].filter(Boolean);
            if (labels.length > 0) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.payload.issue.number, labels });
            }
