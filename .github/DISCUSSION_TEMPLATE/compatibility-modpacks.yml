body:
  - type: markdown
    attributes:
      value: |
        Ask whether mods work together, share setups that work, or get help putting Arcane Library in a modpack (tome pools for other mods' enchantments, the vanilla enchanting table option, servers). When a reply answers it, mark it as the answer so others can find it.

        If something is broken with another mod, [report a conflict with another mod](https://github.com/Pandaismyname1/arcane-library/issues/new?template=3-mod-conflict.yml) instead.

  - type: textarea
    id: topic
    attributes:
      label: Your question or finding
      placeholder: Do enchantments from other mods drop as tomes in the Library?
    validations:
      required: true

  - type: input
    id: mods
    attributes:
      label: The mods, datapacks or modpack involved
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Arcane Library version
      placeholder: 0.1.0
    validations:
      required: false
