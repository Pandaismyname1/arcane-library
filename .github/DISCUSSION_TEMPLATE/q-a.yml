body:
  - type: markdown
    attributes:
      value: |
        Ask anything about playing Arcane Library: finding the tower, portals, tomes and mastery, the Lectern, the Archivist, servers and modpacks. When someone's answer solves it, mark it as the answer so the next person finds it.

        Found a bug or a crash? [Open an issue](https://github.com/Pandaismyname1/arcane-library/issues/new/choose) instead.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Arcane Library version
      placeholder: 0.1.0
    validations:
      required: false

  - type: input
    id: mods
    attributes:
      label: Modpack or other mods, if they matter
    validations:
      required: false
